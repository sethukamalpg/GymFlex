<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<header th:fragment="header(title, subtitle)" class="app-header">
    <div class="header-left">
        <button id="mobileMenuToggle" class="mobile-toggle" aria-label="Toggle Navigation">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <div class="page-title-box">
            <h1 th:text="${title}">Dashboard</h1>
            <p th:if="${subtitle}" th:text="${subtitle}">Overview & Performance</p>
        </div>
    </div>

    <div class="header-right">
        <div class="header-date-badge">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span th:text="${currentDate != null ? currentDate : #temporals.format(#temporals.createNow(), 'EEEE, MMMM d, yyyy')}">Date</span>
        </div>

        <a th:href="@{/members/add}" class="btn btn-primary btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>Add Member</span>
        </a>
    </div>
</header>

</body>
</html>
