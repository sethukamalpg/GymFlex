<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiring Memberships — GymFlex</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header th:replace="~{fragments/header :: header('Memberships Expiring Soon', 'Members whose membership expires within the next 7 days')}"></header>

        <main class="content-body">
            <!-- Flash Notifications -->
            <div th:if="${successMessage}" class="alert alert-success">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span th:text="${successMessage}">Success message</span>
            </div>

            <div th:if="${errorMessage}" class="alert alert-error">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                <span th:text="${errorMessage}">Error message</span>
            </div>

            <div class="gym-card">
                <div class="card-header-flex">
                    <div class="card-title">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Members Requiring Renewal (Next 7 Days)</span>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="gym-table">
                        <thead>
                            <tr>
                                <th>Member</th>
                                <th>Phone</th>
                                <th>Plan</th>
                                <th>Expiry Date</th>
                                <th>Status</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ms : ${expiringMemberships}">
                                <td>
                                    <a th:href="@{/members/{id}(id=${ms.member.id})}" class="text-primary-bold" th:text="${ms.member.name}" style="text-decoration:none;">Name</a>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);" th:text="${ms.member.email}">Email</div>
                                </td>
                                <td th:text="${ms.member.phone}">Phone</td>
                                <td>
                                    <span class="badge" style="background: rgba(59, 130, 246, 0.1); color:#60a5fa;" th:text="${ms.plan.name}">Plan</span>
                                </td>
                                <td style="font-weight: 600; color: #fff;" th:text="${#temporals.format(ms.expiryDate, 'dd-MM-yyyy')}">Date</td>
                                <td>
                                    <span class="badge badge-warning">
                                        <span class="badge-dot"></span> EXPIRING SOON
                                    </span>
                                </td>
                                <td style="text-align: right;">
                                    <div class="action-buttons-group" style="justify-content: flex-end;">
                                        <a th:href="@{/members/{id}(id=${ms.member.id})}" class="btn btn-secondary btn-sm">View</a>
                                        <form th:action="@{/members/{id}/renew(id=${ms.member.id})}" method="post" style="display:inline;" onsubmit="return confirmAction('Renew membership for ' + this.getAttribute('data-name') + '?');" th:data-name="${ms.member.name}">
                                            <input type="hidden" name="redirectUrl" value="/members/expiring">
                                            <button type="submit" class="btn btn-warning btn-sm">
                                                Renew Plan
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(expiringMemberships)}">
                                <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 3rem;">
                                    🎉 Great news! No memberships are expiring within the next 7 days.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
