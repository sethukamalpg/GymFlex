spring.application.name=GymFlex

spring.datasource.url=jdbc:h2:mem:gymflex;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# Demo Admin Credentials
gymflex.admin.username=${GYMFLEX_ADMIN_USERNAME:admin}
gymflex.admin.password=${GYMFLEX_ADMIN_PASSWORD:admin123}
